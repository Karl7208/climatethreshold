# Supabase 무료 프로젝트가 1주일 동안 활동이 없어 멈추는 것을 막습니다.
# 저장소 Settings > Secrets and variables > Actions 에 SUPABASE_URL, SUPABASE_KEY(Publishable key)를 넣어 두세요.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"   # 사흘마다 12:17 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | Climate Threshold Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23173F31'/%3E%3Crect x='14' y='7' width='4' height='19' fill='%23E2572B'/%3E%3Crect x='3' y='12' width='26' height='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#FAFBFA;--ink:#14201B;--soft:#55645D;--rule:#D3DAD6;--wash:#EEF2EF;--pine:#173F31;--ember:#C8401E;--ok:#1E6B47;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#101714;--ink:#E7EDE9;--soft:#9DACA4;--rule:#2B3731;--wash:#18211D;--pine:#9FD3BC;--ember:#F0683F;--ok:#7FCFA6}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--font);word-break:keep-all;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:1100px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:16px}
.top b{font-weight:600}
.top .sp{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft)}
@media (max-width:640px){.top{position:static}.top .in{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 20px;gap:8px}.top .sp{margin-left:0;flex-wrap:wrap}#who{flex-basis:100%}}
main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.btn{font:inherit;font-size:15px;min-height:42px;padding:0 16px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.warn{border-color:var(--ember);color:var(--ember)}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.card{border:1px solid var(--rule);background:var(--wash);padding:24px;max-width:420px;margin:48px auto}
.card h1{margin:0 0 6px;font-size:22px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;min-width:0}
.f label{font-size:14px;font-weight:500}
.f small{color:var(--soft);font-size:13px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--pine)}
.msg{padding:10px 12px;border:1px solid;margin:12px 0;font-size:15px}
.msg.ok{border-color:var(--ok);color:var(--ok)} .msg.err{border-color:var(--ember);color:var(--ember)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.tabs button{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:2px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--ember);color:#fff;font-size:12px;line-height:20px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar h2{margin:0;font-size:20px;margin-right:auto}
.help{color:var(--soft);font-size:14px;margin:0 0 14px;max-width:60em}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.rows .t{font-weight:500}
.rows .m{color:var(--soft);font-size:14px}
.rows .hid{opacity:.55}
.chip{display:inline-block;font-size:12.5px;padding:1px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--soft);margin-right:6px}
.chip.new{border-color:var(--ember);color:var(--ember)}
.editor{border:1px solid var(--rule);background:var(--wash);padding:20px;margin:0 0 20px}
.editor h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid .full{grid-column:1/-1}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.ro{background:var(--paper);border:1px solid var(--rule);padding:12px;margin-bottom:14px;font-size:15px}
.ro dl{display:grid;grid-template-columns:7em minmax(0,1fr);gap:4px 12px;margin:0}
.ro dt{color:var(--soft)} .ro dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.prev{display:block;max-width:240px;max-height:160px;margin-top:6px;border:1px solid var(--rule)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.acts .del{margin-left:auto}
.inline{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header class="top"><div class="in">
  <b>Climate Threshold Lab · 관리자</b>
  <div class="sp"><span id="who"></span><a class="btn sm" href="index.html" target="_blank" rel="noopener">홈페이지 보기</a><button class="btn sm" id="logout" hidden>로그아웃</button></div>
</div></header>

<main>
  <!-- 로그인 -->
  <form class="card" id="login" hidden>
    <h1>로그인</h1>
    <p class="help">관리자 계정으로만 들어올 수 있습니다.</p>
    <div class="f"><label for="em">이메일</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="f"><label for="pw">암호</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn fill" type="submit">로그인</button>
    <div class="msg err" id="loginMsg" hidden></div>
  </form>

  <div id="noconf" class="card" hidden><h1>연결 설정이 없습니다</h1><p class="help">config.js에 Supabase 주소와 Publishable key를 넣어 주세요.</p></div>
  <div id="notadmin" class="card" hidden><h1>관리자 권한이 없습니다</h1><p class="help">이 계정은 관리자 명단에 없습니다. Supabase SQL Editor에서 관리자 등록 문장을 실행해 주세요.</p></div>

  <!-- 관리 화면 -->
  <div id="app" hidden>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="flash" class="msg" hidden></div>
    <section id="panel"></section>
  </div>
</main>

<script>
(function(){
  var SITE = window.SITE || {};
  var $ = function(id){ return document.getElementById(id); };
  if(!SITE.url || !SITE.key || !window.supabase){ $('noconf').hidden=false; return; }
  var sb = window.supabase.createClient(SITE.url, SITE.key);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function flash(kind, text){ var f=$('flash'); f.className='msg '+kind; f.textContent=text; f.hidden=false; clearTimeout(flash.t); flash.t=setTimeout(function(){f.hidden=true;}, kind==='ok'?3000:8000); }

  var STATUS = ['새 문의','회신함','통화함','제안함','수주','보류','종료'];
  var PSTAT = [['','특허 없음(공개 연구)'],['filed','출원'],['fast','우선심사 신청'],['granted','등록·보유']];
  var PAPER = [['pre','프리프린트'],['rev','심사 중'],['pub','게재']];
  var COLORS = [['slide','갈색(산사태)'],['rain','파랑(강우)'],['fire','주황(산불)'],['bee','노랑(꿀벌)'],['pest','초록(작물·병해충)'],['net','남색(관측망)']];

  /* ── 탭 정의: 여기에 칸을 더하면 화면에 바로 생깁니다 ── */
  var TABS = {
    enquiries: { label:'문의', table:'enquiries', order:['created_at',false], noAdd:true,
      help:'홈페이지 문의 양식으로 들어온 내용입니다. 상태와 다음 할 일을 적어 관리하세요.',
      filter:{ key:'status', options:STATUS },
      summary:function(r){ return {t:(r.organisation||'')+' · '+(r.name||''), m:fmtDate(r.created_at)+' · '+(r.type||'')+(r.area?' · '+r.area:''), chip:r.status, chipNew:r.status==='새 문의'}; },
      readonly:[['created_at','받은 시각'],['name','이름'],['organisation','소속'],['role','부서·직책'],['sector','기관 유형'],['email','이메일'],['phone','전화'],['type','문의 유형'],['area','대상 지역'],['hazards','관심 분야'],['preferred_date','통화 희망일'],['preferred_time','희망 시간대'],['reply_by','회신 방법'],['message','문의 내용']],
      fields:[ {k:'status',l:'상태',t:'select',o:STATUS.map(function(s){return [s,s];})},
               {k:'next_date',l:'다음 할 날짜',t:'date'},
               {k:'next_step',l:'다음 할 일',t:'text',full:true},
               {k:'memo',l:'메모(통화 내용 등)',t:'textarea',full:true} ] },
    ledger_rows: { label:'기술 장부', table:'ledger_rows', order:['sort',true],
      help:'홈페이지 "기술과 근거"의 한 줄이 기술 하나입니다. 특허 번호와 상태를 여기서 고치고, 논문은 "논문" 탭에서 이 줄에 붙이세요.',
      summary:function(r){ return {t:r.tech_ko, m:(r.patent_no||r.patent_label||'번호 없음')+' · '+lab(PSTAT,r.patent_status||''), hid:!r.visible}; },
      fields:[ {k:'tech_ko',l:'기술 이름(한국어)',t:'text',req:true,full:true}, {k:'tech_en',l:'기술 이름(영어)',t:'text',full:true},
               {k:'desc_ko',l:'한 줄 설명(한국어)',t:'text'}, {k:'desc_en',l:'한 줄 설명(영어)',t:'text'},
               {k:'patent_no',l:'특허 출원·등록 번호',t:'text',hint:'예: 10-2026-0211019'}, {k:'patent_status',l:'특허 상태',t:'select',o:PSTAT},
               {k:'patent_label',l:'번호 대신 보일 이름',t:'text',hint:'번호가 없을 때만 보입니다'}, {k:'sort',l:'순서(작을수록 위)',t:'number',def:100},
               {k:'visible',l:'홈페이지에 보이기',t:'bool',def:true} ] },
    papers: { label:'논문', table:'papers', order:['row_id',true], order2:['sort',true],
      help:'논문이 게재되면 상태를 "게재"로 바꾸고 DOI와 학술지 정보를 넣으세요. 홈페이지에 바로 링크가 걸립니다. 이중 익명 심사 중인 원고는 넣지 마세요.',
      summary:function(r){ return {t:r.title||r.title_ko||'(제목 없음)', m:rowName(r.row_id)+(r.doi?' · doi:'+r.doi:''), chip:lab(PAPER,r.status), hid:!r.visible}; },
      fields:[ {k:'row_id',l:'어느 기술에 붙일까',t:'select',o:function(){ return LEDGER.map(function(x){return [String(x.id), x.tech_ko];}); },req:true,full:true,num:true},
               {k:'status',l:'상태',t:'select',o:PAPER,req:true}, {k:'sort',l:'순서',t:'number',def:100},
               {k:'title',l:'영문 원제목',t:'textarea',full:true,hint:'프리프린트나 게재 논문일 때'},
               {k:'title_ko',l:'짧은 이름(한국어)',t:'text',hint:'심사 중일 때 제목 대신'}, {k:'title_en',l:'짧은 이름(영어)',t:'text'},
               {k:'venue',l:'학술지·권·쪽',t:'text',hint:'예: Natural Hazards 120, 1234'}, {k:'doi',l:'DOI',t:'text',hint:'10.으로 시작하는 부분만. 주소를 붙여도 됩니다'},
               {k:'visible',l:'홈페이지에 보이기',t:'bool',def:true} ] },
    apps: { label:'앱·서비스', table:'apps', order:['sort',true],
      help:'홈페이지 "참고 > 다른 분야에서 운영한 서비스"의 카드입니다. 새 앱을 추가하거나, 말벌 시스템처럼 숨겨 둔 카드를 특허 출원 뒤 "보이기"로 바꾸세요.',
      summary:function(r){ return {t:r.title_ko, m:(r.status_ko||'')+(r.url?' · '+r.url:''), hid:!r.visible}; },
      fields:[ {k:'title_ko',l:'이름(한국어)',t:'text',req:true}, {k:'title_en',l:'이름(영어)',t:'text'},
               {k:'status_ko',l:'상태 표시(한국어)',t:'text',hint:'예: 운영 중'}, {k:'status_en',l:'상태 표시(영어)',t:'text',hint:'예: Live'},
               {k:'body_ko',l:'설명(한국어)',t:'textarea'}, {k:'body_en',l:'설명(영어)',t:'textarea'},
               {k:'by_ko',l:'소속·출처(한국어)',t:'text'}, {k:'by_en',l:'소속·출처(영어)',t:'text'},
               {k:'url',l:'서비스 주소',t:'text',full:true}, {k:'image_url',l:'대표 사진',t:'image',full:true},
               {k:'color',l:'색',t:'select',o:COLORS,def:'slide'}, {k:'sort',l:'순서',t:'number',def:100},
               {k:'visible',l:'홈페이지에 보이기',t:'bool',def:true} ] },
    posts: { label:'소식', table:'posts', order:['published_at',false],
      help:'홈페이지 "소식"에 최근 6개가 보입니다. 글이 하나도 없으면 소식 구역이 숨겨집니다. LinkedIn 글의 원본으로 쓰세요.',
      summary:function(r){ return {t:r.title_ko, m:r.published_at, hid:!r.visible}; },
      fields:[ {k:'published_at',l:'날짜',t:'date',def:today(),req:true}, {k:'link',l:'관련 링크(선택)',t:'text'},
               {k:'title_ko',l:'제목(한국어)',t:'text',req:true}, {k:'title_en',l:'제목(영어)',t:'text'},
               {k:'body_ko',l:'내용(한국어)',t:'textarea'}, {k:'body_en',l:'내용(영어)',t:'textarea'},
               {k:'image_url',l:'사진(선택)',t:'image',full:true}, {k:'visible',l:'홈페이지에 보이기',t:'bool',def:true} ] },
    settings: { label:'사진·영상·링크', table:'settings', key:'key', order:['key',true], noAdd:true, noDelete:true,
      help:'사진은 여기서 바로 올릴 수 있습니다. 영상은 GitHub 저장소의 media 폴더에 올리고 주소만 적는 편이 좋습니다(Supabase 무료 요금제는 전송량이 적습니다).',
      summary:function(r){ return {t:r.note||r.key, m:r.value||'(비어 있음)'}; },
      fields:function(r){ var img=/photo|poster/.test(r.key), vid=/video/.test(r.key);
        return [{k:'value',l:r.note||r.key,t:img?'image':(vid?'video':'text'),full:true,hint:r.key==='replay_url'?'비우면 "공개 준비 중"으로 보입니다':''}]; } }
  };
  var LEDGER = [];
  function lab(list,v){ for(var i=0;i<list.length;i++) if(list[i][0]===v) return list[i][1]; return v||''; }
  function rowName(id){ for(var i=0;i<LEDGER.length;i++) if(LEDGER[i].id===id) return LEDGER[i].tech_ko; return '?'; }
  function fmtDate(s){ if(!s) return ''; var d=new Date(s); return d.toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}); }
  function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

  /* ── 로그인 ── */
  var cur = 'enquiries';
  function showLogin(){ $('login').hidden=false; $('app').hidden=true; $('logout').hidden=true; $('who').textContent=''; }
  $('login').addEventListener('submit', function(e){
    e.preventDefault(); var m=$('loginMsg'); m.hidden=true;
    sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value}).then(function(r){
      if(r.error){ m.textContent='로그인하지 못했습니다: 이메일과 암호를 확인해 주세요.'; m.hidden=false; return; }
      start(r.data.user);
    });
  });
  $('logout').addEventListener('click', function(){ sb.auth.signOut().then(function(){ location.reload(); }); });
  sb.auth.getSession().then(function(r){ var s=r.data.session; if(s) start(s.user); else showLogin(); });

  function start(user){
    sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle().then(function(r){
      $('login').hidden=true;
      if(r.error || !r.data){ $('notadmin').hidden=false; $('logout').hidden=false; return; }
      $('who').textContent=user.email; $('logout').hidden=false; $('app').hidden=false;
      drawTabs(); loadLedger().then(function(){ open(cur); });
      countNew();
    });
  }
  function loadLedger(){ return sb.from('ledger_rows').select('id,tech_ko').order('sort').then(function(r){ LEDGER=r.data||[]; }); }
  function countNew(){
    sb.from('enquiries').select('id',{count:'exact',head:true}).eq('status','새 문의').then(function(r){
      var b=document.querySelector('[data-tab=enquiries] .n'); if(!b) return;
      b.textContent=r.count||''; b.hidden=!r.count;
    });
  }
  function drawTabs(){
    var t=$('tabs'); t.innerHTML='';
    Object.keys(TABS).forEach(function(k){
      var b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.dataset.tab=k;
      b.innerHTML=esc(TABS[k].label)+(k==='enquiries'?'<span class="n" hidden></span>':'');
      b.addEventListener('click', function(){ open(k); }); t.appendChild(b);
    });
  }

  /* ── 목록 ── */
  var filterVal='';
  function open(k){
    cur=k; var T=TABS[k];
    document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===k)); });
    var p=$('panel');
    p.innerHTML='<div class="bar"><h2>'+esc(T.label)+'</h2>'+
      (T.filter?'<select id="flt" aria-label="상태로 거르기" style="width:auto"><option value="">전체</option>'+T.filter.options.map(function(o){return '<option'+(o===filterVal?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>':'')+
      (T.noAdd?'':'<button class="btn fill" id="add" type="button">+ 새로 추가</button>')+'</div>'+
      '<p class="help">'+esc(T.help)+'</p><div id="ed"></div><ul class="rows" id="list"><li class="m">불러오는 중…</li></ul>';
    if($('add')) $('add').addEventListener('click', function(){ edit(null); });
    if($('flt')) $('flt').addEventListener('change', function(){ filterVal=this.value; load(); });
    load();
  }
  function load(){
    var T=TABS[cur], q=sb.from(T.table).select('*').order(T.order[0],{ascending:T.order[1]});
    if(T.order2) q=q.order(T.order2[0],{ascending:T.order2[1]});
    if(T.filter && filterVal) q=q.eq(T.filter.key, filterVal);
    q.then(function(r){
      var ul=$('list'); if(!ul) return;
      if(r.error){ ul.innerHTML='<li class="m">불러오지 못했습니다: '+esc(r.error.message)+'</li>'; return; }
      if(!r.data.length){ ul.innerHTML='<li class="m">아직 없습니다.</li>'; return; }
      ul.innerHTML='';
      r.data.forEach(function(row){
        var s=T.summary(row), li=document.createElement('li');
        if(s.hid) li.className='hid';
        li.innerHTML='<div><div class="t">'+(s.chip?'<span class="chip'+(s.chipNew?' new':'')+'">'+esc(s.chip)+'</span>':'')+esc(s.t)+(s.hid?' <span class="chip">숨김</span>':'')+'</div><div class="m">'+esc(s.m)+'</div></div>';
        var b=document.createElement('button'); b.type='button'; b.className='btn sm'; b.textContent='편집';
        b.addEventListener('click', function(){ edit(row); }); li.appendChild(b); ul.appendChild(li);
      });
    });
  }

  /* ── 편집 ── */
  function edit(row){
    var T=TABS[cur], fields=typeof T.fields==='function'?T.fields(row):T.fields, ed=$('ed');
    var isNew=!row; row=row||{};
    var h='<form class="editor" id="frm" novalidate><h3>'+(isNew?'새로 추가':'편집')+'</h3>';
    if(T.readonly && !isNew){
      h+='<div class="ro"><dl>'+T.readonly.map(function(f){ var v=row[f[0]]; if(f[0]==='created_at') v=fmtDate(v);
        if(f[0]==='email'&&v) return '<dt>'+esc(f[1])+'</dt><dd><a href="mailto:'+esc(v)+'">'+esc(v)+'</a></dd>';
        return (v==null||v==='')?'':'<dt>'+esc(f[1])+'</dt><dd>'+esc(v)+'</dd>'; }).join('')+'</dl></div>';
    }
    h+='<div class="grid">';
    fields.forEach(function(f){
      var v=row[f.k]; if(isNew && v==null && f.def!=null) v=f.def; if(v==null) v='';
      var id='f_'+f.k, req=f.req?' required':'';
      h+='<div class="f'+(f.full?' full':'')+'"><label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>';
      if(f.t==='textarea') h+='<textarea id="'+id+'"'+req+'>'+esc(v)+'</textarea>';
      else if(f.t==='select'){ var o=typeof f.o==='function'?f.o():f.o;
        h+='<select id="'+id+'"'+req+'>'+(f.req?'<option value="">선택하세요</option>':'')+o.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(v)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>'; }
      else if(f.t==='bool') h+='<span class="inline"><input type="checkbox" id="'+id+'"'+(v===true||v==='true'?' checked':'')+'> 예</span>';
      else if(f.t==='number') h+='<input id="'+id+'" type="number" inputmode="numeric" value="'+esc(v)+'">';
      else if(f.t==='date') h+='<input id="'+id+'" type="date" value="'+esc(v)+'"'+req+'>';
      else if(f.t==='image'||f.t==='video'){
        h+='<input id="'+id+'" type="text" value="'+esc(v)+'" placeholder="주소를 적거나 아래에서 파일을 올리세요">'+
           '<input type="file" id="'+id+'_file" accept="'+(f.t==='image'?'image/*':'video/mp4')+'">'+
           (f.t==='image'&&v?'<img class="prev" id="'+id+'_prev" src="'+esc(v)+'" alt="">':'<img class="prev" id="'+id+'_prev" alt="" hidden>');
      }
      else h+='<input id="'+id+'" type="text" value="'+esc(v)+'"'+req+'>';
      if(f.hint) h+='<small>'+esc(f.hint)+'</small>';
      h+='</div>';
    });
    h+='</div><div class="acts"><button class="btn fill" type="submit">저장</button><button class="btn" type="button" id="cancel">닫기</button>'+
       (!isNew&&!T.noDelete?'<button class="btn warn del" type="button" id="del">삭제</button>':'')+'</div></form>';
    ed.innerHTML=h; ed.scrollIntoView({behavior:'smooth',block:'start'});
    $('cancel').addEventListener('click', function(){ ed.innerHTML=''; });
    fields.forEach(function(f){
      if(f.t!=='image'&&f.t!=='video') return;
      $('f_'+f.k+'_file').addEventListener('change', function(){ upload(this.files[0], f); });
    });
    if($('del')) $('del').addEventListener('click', function(){
      if(!confirm('정말 삭제할까요? 되돌릴 수 없습니다.')) return;
      var q=sb.from(T.table).delete(); q=T.key?q.eq(T.key,row[T.key]):q.eq('id',row.id);
      q.then(function(r){ if(r.error) return flash('err','삭제하지 못했습니다: '+r.error.message); ed.innerHTML=''; flash('ok','삭제했습니다.'); after(); });
    });
    $('frm').addEventListener('submit', function(e){
      e.preventDefault();
      var data={}, bad=null;
      fields.forEach(function(f){
        var el=$('f_'+f.k), v;
        if(f.t==='bool') v=el.checked;
        else if(f.t==='number') v=el.value===''?null:Number(el.value);
        else { v=el.value.trim(); if(v==='') v=null; }
        if(f.num && v!=null) v=Number(v);
        if(f.k==='doi' && v) v=v.replace(/^https?:\/\/(dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'');
        if(f.req && (v==null||v==='') && !bad) bad=el;
        data[f.k]=v;
      });
      if(bad){ bad.focus(); return flash('err','* 표시한 칸을 채워 주세요.'); }
      var q;
      if(isNew) q=sb.from(T.table).insert(data);
      else { q=sb.from(T.table).update(data); q=T.key?q.eq(T.key,row[T.key]):q.eq('id',row.id); }
      q.then(function(r){
        if(r.error) return flash('err','저장하지 못했습니다: '+r.error.message);
        ed.innerHTML=''; flash('ok','저장했습니다. 홈페이지를 새로 고치면 바로 보입니다.'); after();
      });
    });
  }
  function after(){ if(cur==='ledger_rows') loadLedger(); if(cur==='enquiries') countNew(); load(); }

  /* ── 파일 올리기(Supabase 저장소 'site') ── */
  function upload(file, f){
    if(!file) return;
    var big = file.size > 50*1024*1024;
    if(big) return flash('err','50 MB가 넘는 파일은 올릴 수 없습니다.');
    if(f.t==='video' && !confirm('영상을 Supabase에 올리면 방문자가 볼 때마다 무료 전송량(월 5 GB)이 줄어듭니다. 그래도 올릴까요?')) return;
    var name=file.name.toLowerCase().replace(/[^a-z0-9.\-_]/g,'-');
    var path=(f.t==='video'?'video/':'img/')+Date.now()+'-'+name;
    flash('ok','올리는 중…');
    sb.storage.from('site').upload(path, file, {cacheControl:'31536000', upsert:false, contentType:file.type}).then(function(r){
      if(r.error) return flash('err','올리지 못했습니다: '+r.error.message);
      var url=sb.storage.from('site').getPublicUrl(path).data.publicUrl;
      $('f_'+f.k).value=url;
      var pv=$('f_'+f.k+'_prev'); if(pv && f.t==='image'){ pv.src=url; pv.hidden=false; }
      flash('ok','올렸습니다. "저장"을 눌러야 홈페이지에 반영됩니다.');
    });
  }
})();
</script>
